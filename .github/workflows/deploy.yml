name: Live Auto-Deploy to VPS

on:
push:
branches:
- main 

jobs:
deploy-to-production:
runs-on: ubuntu-latest
steps:
- name: Trigger Auto Deploy Script on VPS
uses: appleboy/ssh-action@v1.0.3
with:
host: ${{ secrets.VPS_IP }}
username: root
key: ${{ secrets.VPS_SSH_KEY }}
script: |
/usr/local/bin/update-meldir
